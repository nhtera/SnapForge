name: SnapForge
options:
  bundleIdPrefix: com.snapforge
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions:
    - en
    - vi

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: C5K2W2P8WD

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.8.1

targets:
  SnapForge:
    type: application
    platform: macOS
    sources:
      - path: SnapForge
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snapforge.app
        PRODUCT_NAME: SnapForge
        INFOPLIST_FILE: SnapForge/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SnapForge/SnapForge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.0.10"
        CURRENT_PROJECT_VERSION: "10"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: Sparkle
    resources:
      - path: SnapForge/Resources/Assets.xcassets
      - path: SnapForge/Resources/en.lproj
      - path: SnapForge/Resources/vi.lproj

  SnapForgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SnapForgeTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snapforge.tests
        PRODUCT_NAME: SnapForgeTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SnapForge
